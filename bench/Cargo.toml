# Benchmarks, in a separate package so that criterion and its dependencies do
# not affect inari's minimum supported Rust version. See BENCHMARKS.md.
[package]
name = "inari-bench"
version = "0.0.0"
edition = "2021"
publish = false

# Not a member of a workspace.
[workspace]

[features]
force-generic = ["inari/force-generic"]

[dependencies]
inari = { path = "..", default-features = false, features = ["__bench"] }

[dev-dependencies]
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }

[lib]
bench = false

[[bench]]
name = "primitives"
harness = false

[[bench]]
name = "intervals"
harness = false

[profile.bench]
codegen-units = 1
lto = "fat"
