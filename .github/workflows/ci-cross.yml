name: ci-cross

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly
          override: true
          profile: minimal
          components: clippy

      - name: Add targets
        run: rustup target add wasm32-unknown-unknown wasm32-wasip1 riscv64gc-unknown-linux-gnu i686-unknown-linux-gnu

      # The 32-bit C library and startup files, which linking for
      # i686-unknown-linux-gnu needs.
      - name: Install gcc-multilib
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-multilib

      - uses: bytecodealliance/actions/wasmtime/setup@v1

      - uses: Swatinem/rust-cache@v2

      # GMP and MPFR are not available for these targets.
      - name: Build (wasm32-unknown-unknown)
        run: cargo build --release --no-default-features --target wasm32-unknown-unknown

      - name: Build (riscv64gc-unknown-linux-gnu)
        run: cargo build --release --no-default-features --target riscv64gc-unknown-linux-gnu

      - name: Clippy (wasm32-unknown-unknown)
        run: cargo clippy --no-default-features --target wasm32-unknown-unknown

      - name: Test (wasm32-wasip1)
        run: cargo test --release --no-default-features --lib --tests --target wasm32-wasip1

      # The `wasm32` backend, which needs the `simd128` target feature.
      - name: Clippy (wasm32-unknown-unknown, simd128)
        run: cargo clippy --no-default-features --target wasm32-unknown-unknown
        env:
          RUSTFLAGS: -Dwarnings -Ctarget-feature=+simd128

      - name: Test (wasm32-wasip1, simd128)
        run: cargo test --release --no-default-features --lib --tests --target wasm32-wasip1
        env:
          RUSTFLAGS: -Dwarnings -Ctarget-feature=+simd128

      # A 32-bit target, on which `usize` has 32 bits and `src/simd.rs` selects the
      # `generic` backend. Cargo.toml gives the dev-dependencies on `rug` and
      # `gmp-mpfr-sys` only for 64-bit Linux and macOS, and the tests that compare
      # with MPFR are compiled under the same `cfg`, so this step runs the others.
      - name: Test (i686-unknown-linux-gnu)
        run: cargo test --release --lib --tests --target i686-unknown-linux-gnu
