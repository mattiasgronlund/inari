name: ci-rocq

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  proofs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The proofs in `Valid.v` and `ComCommon.v` rely on a list of the places
      # in `src` that make an `Interval` or a `DecInterval`, which the greps in
      # rocq/README.md, "What is assumed", find. This fails if the lines that
      # they find change, also in a change to the Rust code alone.
      - name: Check the places that make an interval
        run: rocq/check-sites.sh

      # The container runs as a user that does not own the checkout, and has
      # to write the compiled proofs next to the sources.
      - name: Make the proofs writable by the container
        run: chmod -R a+w rocq

      # Docker pulls the image by its digest and ignores the tag. To update
      # it, write the new tag and the Digest that
      # `docker buildx imagetools inspect rocq/rocq-prover:<tag>` prints.
      - name: Check the proofs
        run: >
          docker run --rm -v "$PWD/rocq:/w" -w /w
          rocq/rocq-prover:9.1@sha256:9a1e969649a3cc3c6f310d5be5a842e2187384560337c6c0807aba9f8565efba
          bash -c 'opam install -y coq-flocq.4.2.2 && make'
