name: ci-x86-64

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: -Ctarget-cpu=haswell -Dwarnings
  RUSTFLAGS: -Ctarget-cpu=haswell -Dwarnings

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/gmp-mpfr-sys
          key: ${{ runner.os }}-${{ secrets.CACHE_VERSION }}-${{ hashFiles('Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ secrets.CACHE_VERSION }}-

      - uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly
          override: true
          profile: minimal
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Is AVX-512F available?
        id: avx512f
        run: lscpu | grep --quiet avx512f
        continue-on-error: true

      - name: Test
        run: cargo test --release

      - name: Test (target AVX-512F)
        run: cargo test --release
        if: ${{ steps.avx512f.outcome == 'success' }}
        env:
          RUSTFLAGS: ${{ env.RUSTFLAGS }} -Ctarget-feature=+avx512f
          RUSTDOCFLAGS: ${{ env.RUSTDOCFLAGS }} -Ctarget-feature=+avx512f

      - name: Test (target Nehalem)
        run: cargo test --release
        env:
          RUSTFLAGS: -Ctarget-cpu=nehalem -Dwarnings
          RUSTDOCFLAGS: -Ctarget-cpu=nehalem -Dwarnings

      - name: Test (--no-default-features)
        run: cargo test --release --no-default-features --lib --tests

      - name: Test (--features force-generic)
        run: cargo test --release --features force-generic

      - name: Clippy
        run: cargo clippy --all-targets

      - name: Clippy (target AVX-512F)
        run: cargo clippy --all-targets
        if: ${{ steps.avx512f.outcome == 'success' }}
        env:
          RUSTFLAGS: ${{ env.RUSTFLAGS }} -Ctarget-feature=+avx512f
          RUSTDOCFLAGS: ${{ env.RUSTDOCFLAGS }} -Ctarget-feature=+avx512f

      - name: Clippy (target Nehalem)
        run: cargo clippy --all-targets
        env:
          RUSTFLAGS: -Ctarget-cpu=nehalem -Dwarnings
          RUSTDOCFLAGS: -Ctarget-cpu=nehalem -Dwarnings

      - name: Check format
        run: cargo fmt -- --check

      - name: Check docs
        run: cargo rustdoc

      # With `--cfg docsrs`, as on docs.rs, `src/simd.rs` selects the stubs in
      # `src/simd/unimplemented.rs`. Rustdoc does not report a call to a missing
      # function inside a function body, so `cargo rustdoc` passes when a stub is
      # missing. This step checks the crate with that configuration. Like docs.rs,
      # it passes `--cfg docsrs` to this crate alone: in `RUSTFLAGS` it would also
      # reach the dependencies, where a crate may use it to document an API of
      # another platform, which does not compile here.
      - name: Check docs.rs configuration
        run: cargo rustc --lib --all-features --profile check -- --cfg docsrs

  coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/gmp-mpfr-sys
          key: ${{ env.GITHUB_JOB }}-${{ secrets.CACHE_VERSION }}-${{ hashFiles('Cargo.toml') }}
          restore-keys: |
            ${{ env.GITHUB_JOB }}-${{ secrets.CACHE_VERSION }}-

      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          profile: minimal
          components: llvm-tools-preview

      - uses: taiki-e/install-action@cargo-llvm-cov

      - uses: Swatinem/rust-cache@v2

      - name: Coverage
        run: cargo llvm-cov

  msrv:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/gmp-mpfr-sys
          key: ${{ runner.os }}-${{ secrets.CACHE_VERSION }}-${{ hashFiles('Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ secrets.CACHE_VERSION }}-

      - uses: actions-rs/toolchain@v1
        with:
          toolchain: 1.65.0
          override: true
          profile: minimal

      # The newest versions of some dependencies need a newer Rust. Pick the newest
      # versions that support the `rust-version` in Cargo.toml.
      - name: Generate lockfile
        run: cargo +stable --config 'resolver.incompatible-rust-versions="fallback"' generate-lockfile

      - uses: Swatinem/rust-cache@v2

      # No step in this job sets `-Ctarget-feature=+avx512f`. On Rust 1.65.0 that
      # flag sets no `cfg(target_feature = "avx512f")`, so `src/simd/x86_64.rs`
      # would select the `fma` backend, which this step already checks. Stable Rust
      # selects the `avx512f` backend only from 1.89 on. The `avx512f` job checks
      # and lints it on 1.89 in every run; its tests run only in the `build` job,
      # on nightly, when the runner has AVX-512F.
      - name: Check
        run: cargo check --all-targets

      - name: Check (target Nehalem)
        run: cargo check --all-targets
        env:
          RUSTFLAGS: -Ctarget-cpu=nehalem -Dwarnings
          RUSTDOCFLAGS: -Ctarget-cpu=nehalem -Dwarnings

      - name: Check (--no-default-features)
        run: cargo check --no-default-features --all-targets

  # Stable Rust selects the `avx512f` backend from 1.89 on, so this job checks and
  # lints it on 1.89. It runs nothing built with `+avx512f`, so the runner needs
  # no AVX-512F.
  avx512f:
    runs-on: ubuntu-latest

    # The workflow's `RUSTFLAGS` with `+avx512f`, written out because a job's `env`
    # cannot read the `env` context. `cargo check` and `cargo clippy` below get
    # `--target x86_64-unknown-linux-gnu`, which keeps these flags away from build
    # scripts: built with them, a build script can die with SIGILL on a runner
    # without AVX-512F.
    env:
      RUSTFLAGS: -Ctarget-cpu=haswell -Dwarnings -Ctarget-feature=+avx512f

    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/gmp-mpfr-sys
          key: ${{ runner.os }}-${{ secrets.CACHE_VERSION }}-${{ hashFiles('Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ secrets.CACHE_VERSION }}-

      - uses: actions-rs/toolchain@v1
        with:
          toolchain: 1.89.0
          override: true
          profile: minimal
          components: clippy

      # Resolve dependencies as the `msrv` job does, preferring releases that
      # support the `rust-version` in Cargo.toml to the newest ones, which may
      # need a Rust newer than 1.89.
      - name: Generate lockfile
        run: cargo +stable --config 'resolver.incompatible-rust-versions="fallback"' generate-lockfile

      - uses: Swatinem/rust-cache@v2

      # `src/simd/x86_64.rs`, which the steps below compile, selects the `avx512f`
      # backend exactly when rustc reports this target feature.
      - name: Check that `avx512f` is selected
        shell: bash
        run: |
          rustc --version
          rustc --print cfg $RUSTFLAGS --target x86_64-unknown-linux-gnu | grep -x 'target_feature="avx512f"'

      - name: Check
        run: cargo check --all-targets --target x86_64-unknown-linux-gnu

      - name: Clippy
        run: cargo clippy --all-targets --target x86_64-unknown-linux-gnu
