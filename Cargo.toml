[package]
name = "inari"
version = "2.0.0"
authors = ["Masashi Mizuno"]
edition = "2021"
rust-version = "1.86.0"
description = "A Rust implementation of interval arithmetic"
documentation = "https://docs.rs/inari"
readme = "README.md"
repository = "https://github.com/unageek/inari"
license = "MIT"
keywords = ["arithmetic", "interval", "math", "numerics"]
categories = ["mathematics", "science"]
include = [
  "/.cargo/**",
  "/examples/**",
  "/src/**",
  "/tests/**",
  "/Cargo.toml",
  "/CHANGELOG.md",
  "/LICENSE",
  "/README.md",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs", "--html-in-header", "src/_docs/header.html"]

[features]
default = []
# Deprecated: does nothing; to be removed in the next major release. Literals, formatting and
# the elementary functions need neither GMP nor MPFR now.
gmp = []
# Deprecated: do nothing; to be removed in the next major release. They keep the features that
# Cargo used to derive from the optional dependencies of `gmp`.
gmp-mpfr-sys = []
nom = []
rug = []
# Use the portable backend (src/simd/generic.rs) on every architecture.
force-generic = []
# Not public API: exposes the SIMD primitives to the benchmarks in bench/.
__bench = []

[dependencies]
cfg-if = "1.0"
forward_ref = "1.0.0"

[dependencies.libm]
version = "0.2"
optional = true

[dependencies.nom]
version = "7.0"
default-features = false
features = ["std"]

# The tests compare inari's results with MPFR's, on the platforms where `gmp-mpfr-sys` builds
# GMP and MPFR. The test code that uses them is compiled under the same `cfg` expression.
[target.'cfg(all(target_pointer_width = "64", any(target_os = "linux", target_os = "macos")))'.dev-dependencies.gmp-mpfr-sys]
version = "1.5"
default-features = false
features = ["mpfr"]

[target.'cfg(all(target_pointer_width = "64", any(target_os = "linux", target_os = "macos")))'.dev-dependencies.rug]
version = "1.19"
default-features = false
features = ["float", "integer", "rational"]

[[example]]
name = "exp"
required-features = ["libm"]

[[example]]
name = "log"
required-features = ["libm"]
